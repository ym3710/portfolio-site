<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>甲子園パワーランキング</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 640px;
      margin: 60px auto;
      padding: 0 20px;
      line-height: 1.8;
      color: #222;
    }
    a { color: #666; }
    h1 { margin-bottom: 4px; }
    .desc { color: #666; margin-top: 0; }

    .formula {
      background: #f7f7f2;
      border: 1px solid #eee;
      border-radius: 6px;
      padding: 14px 16px;
      font-size: 13.5px;
      color: #555;
      margin: 20px 0 28px;
    }
    .formula code {
      display: block;
      margin-top: 6px;
      font-size: 13px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14.5px;
    }
    th, td {
      text-align: right;
      padding: 10px 8px;
      border-bottom: 1px solid #eee;
    }
    th:first-child, td:first-child { text-align: center; width: 36px; }
    th:nth-child(2), td:nth-child(2) { text-align: left; }
    th { color: #888; font-weight: normal; font-size: 12.5px; }

    tr.rank-1 td { font-weight: bold; }
    .school-pref { color: #999; font-size: 12px; display: block; }
    .score { font-weight: bold; color: #b8562e; }
  </style>
</head>
<body>

  <p><a href="index.html">← 自己紹介ページに戻る</a></p>

  <h1>甲子園パワーランキング</h1>
  <p class="desc">春夏通算の甲子園実績だけで独自にスコア化した、非公式のパワーランキング(β版・5校)。</p>

  <div class="formula">
    スコアの計算方法
    <code>パワースコア = 優勝回数 × 10 + 出場回数 × 2 + 通算勝利数 × 1</code>
  </div>

  <table>
    <thead>
      <tr>
        <th>順位</th>
        <th>学校</th>
        <th>出場</th>
        <th>優勝</th>
        <th>勝利</th>
        <th>スコア</th>
      </tr>
    </thead>
    <tbody id="ranking-body"></tbody>
  </table>

  <script src="koshien-data.js"></script>
  <script>
    function calcScore(school) {
      return school.championships * 10 + school.appearances * 2 + school.wins;
    }

    const ranked = [...KOSHIEN_SCHOOLS]
      .map((school) => ({ ...school, score: calcScore(school) }))
      .sort((a, b) => b.score - a.score);

    const tbody = document.getElementById("ranking-body");
    ranked.forEach((school, index) => {
      const tr = document.createElement("tr");
      if (index === 0) tr.className = "rank-1";

      tr.innerHTML = `
        <td>${index + 1}</td>
        <td>${school.name}<span class="school-pref">${school.pref}</span></td>
        <td>${school.appearances}</td>
        <td>${school.championships}</td>
        <td>${school.wins}</td>
        <td class="score">${school.score}</td>
      `;
      tbody.appendChild(tr);
    });
  </script>

</body>
</html>
