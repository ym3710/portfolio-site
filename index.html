<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>自己紹介ページ</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 640px;
      margin: 60px auto;
      padding: 0 20px;
      line-height: 1.8;
      color: #222;
    }
    h1 {
      margin-bottom: 4px;
    }
    .role {
      color: #666;
      margin-top: 0;
    }
    h2 {
      margin-top: 40px;
      border-bottom: 2px solid #eee;
      padding-bottom: 6px;
    }
    ul {
      padding-left: 20px;
    }
  </style>
</head>
<body>

  <h1>名前をここに書く</h1>
  <p class="role">ここに肩書きや一言を書く（例: Webサイト作りを勉強中）</p>

  <h2>自己紹介</h2>
  <p>
    ここに自己紹介文を書く。どんな人で、何に興味があって、
    これから何をやっていきたいかを2〜3文で。
  </p>

  <h2>興味のあること</h2>
  <ul>
    <li>Web制作</li>
    <li>アプリ開発</li>
    <li>YouTube / SNS運用</li>
  </ul>

  <h2>連絡先</h2>
  <p>ここにメールアドレスやSNSリンクなどを書く</p>

</body>
</html>
