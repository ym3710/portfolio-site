<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>投稿アイデアメモ</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 640px;
      margin: 60px auto;
      padding: 0 20px;
      line-height: 1.8;
      color: #222;
    }
    a { color: #666; }
    h1 { margin-bottom: 4px; }
    .desc { color: #666; margin-top: 0; }

    .add-row {
      display: flex;
      gap: 8px;
      margin: 24px 0;
    }
    .add-row input {
      flex: 1;
      padding: 8px 10px;
      font-size: 15px;
    }
    .add-row button {
      padding: 8px 16px;
      font-size: 15px;
      cursor: pointer;
    }

    ul#memo-list {
      list-style: none;
      padding: 0;
    }
    ul#memo-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border: 1px solid #eee;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    ul#memo-list li .actions {
      display: flex;
      gap: 10px;
      flex: none;
    }
    ul#memo-list li button {
      cursor: pointer;
      border: none;
      background: none;
      color: #999;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <p><a href="index.html">← 自己紹介ページに戻る</a></p>

  <h1>投稿アイデアメモ</h1>
  <p class="desc">SNS/YouTubeの投稿アイデアをここに書き留めておく練習ページ。</p>

  <div class="add-row">
    <input type="text" id="memo-input" placeholder="投稿アイデアを入力..." />
    <button id="add-button">追加</button>
  </div>

  <ul id="memo-list"></ul>

  <!-- Supabaseと通信するための公式ライブラリを読み込む -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ここのURLとキーは「公開してよい」publishable keyなので、コードに直接書いてOK
    const SUPABASE_URL = "https://owtlzmgnukwlcussxvgf.supabase.co";
    const SUPABASE_KEY = "sb_publishable_UBQgHlQflBr-qNNA6T233w_CG9ju1kp";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const input = document.getElementById("memo-input");
    const addButton = document.getElementById("add-button");
    const list = document.getElementById("memo-list");

    // データベースの memos テーブルから全件取得する
    async function loadMemos() {
      const { data, error } = await db
        .from("memos")
        .select("*")
        .order("id", { ascending: true });
      if (error) {
        console.error(error);
        return [];
      }
      return data;
    }

    // 取得したデータを画面上の<ul>に描き直す
    async function render() {
      const memos = await loadMemos();
      list.innerHTML = "";

      memos.forEach((memo) => {
        const li = document.createElement("li");

        const span = document.createElement("span");
        span.textContent = memo.content;

        const editButton = document.createElement("button");
        editButton.textContent = "編集";
        editButton.addEventListener("click", async () => {
          const newText = prompt("編集する内容を入力してください", memo.content);
          if (newText === null) return; // キャンセルされたら何もしない
          const trimmed = newText.trim();
          if (trimmed === "") return;

          await db.from("memos").update({ content: trimmed }).eq("id", memo.id);
          render();
        });

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "削除";
        deleteButton.addEventListener("click", async () => {
          await db.from("memos").delete().eq("id", memo.id);
          render();
        });

        const actions = document.createElement("div");
        actions.className = "actions";
        actions.appendChild(editButton);
        actions.appendChild(deleteButton);

        li.appendChild(span);
        li.appendChild(actions);
        list.appendChild(li);
      });
    }

    // 「追加」ボタンが押されたときの動き
    addButton.addEventListener("click", async () => {
      const text = input.value.trim();
      if (text === "") return;

      await db.from("memos").insert({ content: text });

      input.value = "";
      input.focus();
      render();
    });

    // Enterキーでも追加できるようにする
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        addButton.click();
      }
    });

    // ページを開いたときに、データベースの内容を表示しておく
    render();
  </script>

</body>
</html>
