<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>今日の一言</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 640px;
      margin: 60px auto;
      padding: 0 20px;
      line-height: 1.8;
      color: #222;
    }
    a { color: #666; }
    h1 { margin-bottom: 4px; }
    .desc { color: #666; margin-top: 0; }

    #quote-display {
      margin: 30px 0;
      padding: 24px;
      background: #f7f7f5;
      border-radius: 8px;
      font-size: 18px;
      min-height: 60px;
      display: flex;
      align-items: center;
    }

    button {
      padding: 10px 20px;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <p><a href="index.html">← 自己紹介ページに戻る</a></p>

  <h1>今日の一言</h1>
  <p class="desc">ボタンを押すと、外部サービスから一言をもらってきます。API連携の練習ページ。</p>

  <div id="quote-display">ボタンを押してみてください</div>

  <button id="get-quote">今日の一言をもらう</button>

  <script>
    const button = document.getElementById("get-quote");
    const display = document.getElementById("quote-display");

    // async function: 内部で「待つ処理(await)」を使える特別な関数
    async function fetchAdvice() {
      display.textContent = "読み込み中...";
      button.disabled = true;

      try {
        // fetch: インターネット上の別の場所にデータを取りに行く命令
        const response = await fetch("https://api.adviceslip.com/advice");
        // レスポンス(返事)をJSON(データの形式)として読み取る
        const data = await response.json();
        display.textContent = data.slip.advice;
      } catch (error) {
        // 通信に失敗した場合など、エラーが起きたときの処理
        display.textContent = "取得に失敗しました。もう一度試してください。";
      } finally {
        button.disabled = false;
      }
    }

    button.addEventListener("click", fetchAdvice);
  </script>

</body>
</html>
